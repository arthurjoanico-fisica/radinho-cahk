<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player — Radinho do CAHK</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://www.youtube.com/iframe_api"></script><style>body{margin:0;background:#080809;color:#fff;font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.card{background:#171719;border:1px solid #303035;border-radius:20px;padding:18px;margin:16px 0}input,button{font:inherit;padding:12px 14px;border-radius:12px;border:0}input{background:#101012;color:#fff;border:1px solid #333;width:300px}button{font-weight:700;cursor:pointer}#player{width:100%;aspect-ratio:16/9}.controls{display:flex;gap:10px;flex-wrap:wrap}.queue-item{padding:10px 0;border-bottom:1px solid #2a2a2e}.muted{color:#aaa}</style></head>
<body><main><div class="top"><div><h1>Radinho do CAHK — Player</h1><div class="muted">Use esta tela somente no computador que ficará tocando.</div></div><input id="token" type="password" placeholder="Código do player"></div><div class="card"><div id="player"></div><div class="controls" style="margin-top:14px"><button id="start">INICIAR CAIXINHA</button><button id="skip">Pular música</button><button id="clear">Limpar fila</button></div><div id="msg" class="muted" style="margin-top:10px"></div></div><div class="card"><h2>Fila</h2><div id="queue"></div></div>
<script>
const SUPABASE_URL="https://jcxzlbhwkhtxsabcewuk.supabase.co"; const SUPABASE_KEY="sb_publishable_bRJFBGZdq1pOVpej6ZS7mw_9v24g69Y"; const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); let player,current=null,started=false;
function onYouTubeIframeAPIReady(){ player=new YT.Player("player",{height:"480",width:"854",playerVars:{autoplay:1,controls:1},events:{onStateChange:onState}}); } window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;
async function admin(action,id){ const token=document.querySelector("#token").value.trim(); const r=await fetch(`${SUPABASE_URL}/functions/v1/queue-admin`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"x-admin-token":token},body:JSON.stringify({action,id})}); const j=await r.json(); if(!r.ok) throw new Error(j.error||"Erro administrativo"); return j; }
async function sync(){ const {data,error}=await sb.from("queue").select("*").in("status",["playing","queued"]).order("position",{ascending:true}); if(error)return; const playing=data.find(x=>x.status==="playing"); const queued=data.filter(x=>x.status==="queued"); document.querySelector("#queue").innerHTML=queued.length?queued.map((x,i)=>`<div class="queue-item">${i+1}. <strong>${x.title}</strong> <span class="muted">— ${x.channel||""}</span></div>`).join(""):`<div class="muted">Fila vazia.</div>`; if(!started)return; if(playing){ if(!current || current.id!==playing.id){ current=playing; player.loadVideoById(playing.youtube_id); }} else if(queued[0]){ try{ await admin("play",queued[0].id); }catch(e){document.querySelector("#msg").textContent=e.message;} } }
async function onState(e){ if(e.data===YT.PlayerState.ENDED && current){ try{ await admin("finish",current.id); current=null; await sync(); }catch(err){document.querySelector("#msg").textContent=err.message;} } }
document.querySelector("#start").onclick=async()=>{started=true; document.querySelector("#msg").textContent="Player iniciado."; await sync();}; document.querySelector("#skip").onclick=async()=>{if(current){await admin("skip",current.id);current=null;} await sync();}; document.querySelector("#clear").onclick=async()=>{await admin("clear");await sync();}; sb.channel("queue-player").on("postgres_changes",{event:"*",schema:"public",table:"queue"},()=>sync()).subscribe(); sync();
</script></main></body></html>
