<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rádio CAHK — Programação</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script></head><body><main class="shell admin"><header class="hero"><span class="pill">ADMINISTRAÇÃO</span><h1>PROGRAMAÇÃO</h1><p>Controle o que a Rádio CAHK fala e como ela preenche os intervalos.</p></header><section id="login" class="card login-card"><h2>Acesso administrativo</h2><div class="stack"><input id="token" type="password" placeholder="Código administrativo"><button id="enter" class="primary">Entrar</button><div id="loginMsg" class="muted"></div></div></section><div id="panel" class="hidden"><div class="admin-grid"><section class="card"><h2>Configuração da rádio</h2><form id="cfg" class="form-grid"><label class="span2">Nome<input id="stationName"></label><label class="check span2"><input id="autoMode" type="checkbox">Programação automática</label><label class="check span2"><input id="annsEnabled" type="checkbox">Locuções automáticas</label><label>Locução a cada<input id="every" type="number" min="1" max="20"></label><label>faixas<input value="músicas" disabled></label><label>Velocidade da voz<input id="rate" type="number" min=".5" max="2" step=".05"></label><label>Tom da voz<input id="pitch" type="number" min=".5" max="2" step=".05"></label><label class="span2">Voz preferida<select id="voice"><option value="">Automática</option></select></label><button class="primary span2">Salvar configuração</button></form><hr style="border-color:#2d333c;margin:18px 0"><button id="refresh" class="ghost full">Atualizar Top Música do YouTube</button><div id="refreshMsg" class="status muted small"></div><div id="trackMetric"></div></section><section class="card"><h2>Nova locução</h2><form id="annForm" class="form-grid"><input id="annId" type="hidden"><label class="span2">Nome interno<input id="annTitle" placeholder="Ex.: Coca gelada"></label><label>Tipo<select id="annType"><option value="station">Vinheta</option><option value="product">Produto</option><option value="event">Evento</option><option value="custom">Outro</option></select></label><label>Prioridade<input id="annPriority" type="number" value="0"></label><label class="span2">Texto<textarea id="annText" placeholder="Ex.: Passando pelo CAHK? Tem Coca gelada por quatro reais."></textarea></label><label class="span2">URL de áudio (opcional)<input id="audioUrl" placeholder="Se deixar vazio, usa a voz do navegador"></label><label class="check span2"><input id="annActive" type="checkbox" checked>Ativa</label><div class="row span2"><button class="primary" type="submit">Salvar locução</button><button class="ghost" id="clear" type="button">Limpar</button></div></form></section></div><section class="card"><h2>Locuções cadastradas</h2><div id="anns"></div></section></div></main><script>
const C=window.RADIO_CONFIG,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let state=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function token(){return $('#token').value.trim()}async function api(body){const r=await fetch(`${C.SUPABASE_URL}/functions/v1/radio-admin`,{method:'POST',headers:{'Content-Type':'application/json','apikey':C.SUPABASE_PUBLISHABLE_KEY,'x-admin-token':token()},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erro');return j}function voices(){const vs=speechSynthesis.getVoices().filter(v=>/^pt(-|_)/i.test(v.lang)),cur=state?.config?.preferred_voice||'';$('#voice').innerHTML='<option value="">Automática</option>'+vs.map(v=>`<option ${cur===v.name?'selected':''} value="${esc(v.name)}">${esc(v.name)} — ${esc(v.lang)}</option>`).join('')}speechSynthesis.onvoiceschanged=voices;async function load(){state=await api({action:'list'});const c=state.config;$('#stationName').value=c.station_name;$('#autoMode').checked=c.auto_mode;$('#annsEnabled').checked=c.announcements_enabled;$('#every').value=c.announcement_every_tracks;$('#rate').value=c.speech_rate;$('#pitch').value=c.speech_pitch;voices();render();$('#trackMetric').innerHTML=`<div class="card" style="margin-top:12px"><span class="muted small">Faixas automáticas carregadas</span><h2>${state.tracks.length}</h2></div>`}function render(){$('#anns').innerHTML=state.announcements.length?state.announcements.map(a=>`<div class="item"><div><span class="pill">${esc(a.type)}</span><strong style="display:block;margin-top:6px">${esc(a.title)}</strong><div class="muted">${esc(a.text)}</div><div class="small muted">Prioridade ${a.priority} • ${a.active?'ativa':'desativada'}${a.audio_url?' • áudio próprio':''}</div></div><div class="actions"><button class="ghost" data-edit="${a.id}">Editar</button><button class="danger" data-del="${a.id}">Excluir</button></div></div>`).join(''):'<div class="muted">Nenhuma locução cadastrada.</div>';$$('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$$('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del))}function edit(id){const a=state.announcements.find(x=>x.id===id);$('#annId').value=a.id;$('#annTitle').value=a.title;$('#annType').value=a.type;$('#annPriority').value=a.priority;$('#annText').value=a.text;$('#audioUrl').value=a.audio_url||'';$('#annActive').checked=a.active}function clear(){$('#annForm').reset();$('#annId').value='';$('#annPriority').value='0';$('#annActive').checked=true}$('#clear').onclick=clear;$('#enter').onclick=async()=>{localStorage.setItem('radioCahkAdmin',token());$('#loginMsg').textContent='Validando…';try{await load();$('#login').classList.add('hidden');$('#panel').classList.remove('hidden')}catch(e){$('#loginMsg').textContent=e.message}};$('#cfg').onsubmit=async e=>{e.preventDefault();try{await api({action:'save_config',config:{station_name:$('#stationName').value,auto_mode:$('#autoMode').checked,announcements_enabled:$('#annsEnabled').checked,announcement_every_tracks:Number($('#every').value),preferred_voice:$('#voice').value||null,speech_rate:Number($('#rate').value),speech_pitch:Number($('#pitch').value)}});await load();alert('Configuração salva.')}catch(e){alert(e.message)}};$('#annForm').onsubmit=async e=>{e.preventDefault();const id=$('#annId').value,a={title:$('#annTitle').value,text:$('#annText').value,type:$('#annType').value,priority:Number($('#annPriority').value)||0,audio_url:$('#audioUrl').value.trim()||null,active:$('#annActive').checked};try{await api(id?{action:'update_announcement',id,announcement:a}:{action:'create_announcement',announcement:a});clear();await load()}catch(e){alert(e.message)}};async function del(id){if(!confirm('Excluir esta locução?'))return;try{await api({action:'delete_announcement',id});await load()}catch(e){alert(e.message)}}$('#refresh').onclick=async()=>{$('#refreshMsg').textContent='Consultando YouTube…';try{const j=await api({action:'refresh_top'});$('#refreshMsg').textContent=`Atualizado: ${j.count} faixas elegíveis.`;await load()}catch(e){$('#refreshMsg').textContent=e.message}};const saved=localStorage.getItem('radioCahkAdmin');if(saved)$('#token').value=saved;
</script></body></html>
