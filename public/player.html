<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rádio CAHK — Player</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="https://www.youtube.com/iframe_api"></script></head><body><main class="shell player-shell"><header class="hero"><span class="onair"><span class="dot"></span> RÁDIO CAHK • NO AR</span><h1>PLAYER CENTRAL</h1><p>Deixe esta página aberta no computador conectado à caixa de som.</p></header><section id="loginCard" class="card login-card"><h2>Iniciar estação</h2><div class="stack"><input id="token" type="password" placeholder="Código administrativo"><button class="primary" id="start">INICIAR RÁDIO</button><div class="muted small">O código fica salvo somente neste navegador.</div><div id="startMsg" class="status muted"></div></div></section><div id="station" class="hidden"><div class="player-grid"><section class="card video-card"><div id="videoArea" class="ytwrap"><div id="ytplayer"></div></div><div id="announcementArea" class="announcement-stage hidden"><div><span class="pill">RÁDIO CAHK</span><h2 id="announcementText"></h2></div></div><div class="player-info"><span id="sourceBadge" class="pill">AGUARDANDO</span><h2 id="title">Preparando programação…</h2><div id="channel" class="muted"></div><div class="controls" style="margin-top:14px"><button class="primary" id="skip">Pular</button><button class="ghost" id="clear">Limpar pedidos</button><button class="ghost" id="admin">Programação</button></div><div id="playerMsg" class="status muted"></div></div></section><aside class="card"><h2>Próximos pedidos</h2><div id="queue"></div></aside></div></div></main><script>
const C=window.RADIO_CONFIG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY),$=s=>document.querySelector(s);let yt=null,started=false,current=null,currentType=null,audio=null,idle=true,nextLock=false;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player('ytplayer',{width:'100%',height:'100%',playerVars:{autoplay:1,controls:1,rel:0},events:{onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)finishVideo()}}})};function token(){return $('#token').value.trim()}async function fn(name,body={}){const r=await fetch(`${C.SUPABASE_URL}/functions/v1/${name}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':C.SUPABASE_PUBLISHABLE_KEY,'x-admin-token':token()},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erro');return j}async function qload(){const{data}=await sb.from('queue').select('*').eq('status','queued').neq('source','auto').order('position',{ascending:true}).order('created_at',{ascending:true});$('#queue').innerHTML=data?.length?data.map((x,i)=>`<div class="item"><div><strong>${i+1}. ${esc(x.title)}</strong><div class="muted small">${esc(x.channel||'')}</div></div></div>`).join(''):'<div class="muted">Nenhum pedido. A programação automática assume.</div>'}function showVideo(item){current=item;currentType='video';idle=false;$('#videoArea').classList.remove('hidden');$('#announcementArea').classList.add('hidden');$('#sourceBadge').textContent=item.source==='auto'?'PROGRAMAÇÃO AUTOMÁTICA':'PEDIDO';$('#title').textContent=item.title||'Música';$('#channel').textContent=item.channel||'';if(yt&&item.youtube_id)yt.loadVideoById(item.youtube_id)}function chooseVoice(pref){const v=speechSynthesis.getVoices(),pt=v.filter(x=>/^pt(-|_)/i.test(x.lang));return(pref&&v.find(x=>x.name.includes(pref)))||pt.find(x=>/Brazil|Brasil|Google português/i.test(x.name))||pt[0]||v[0]||null}function speak(text,voice){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=Number(voice?.rate||1);u.pitch=Number(voice?.pitch||1);const v=chooseVoice(voice?.preferred_voice);if(v)u.voice=v;u.onend=()=>next();u.onerror=()=>setTimeout(next,500);speechSynthesis.speak(u)}function showAnn(item,voice){current=item;currentType='announcement';idle=false;$('#videoArea').classList.add('hidden');$('#announcementArea').classList.remove('hidden');$('#sourceBadge').textContent=item.type==='product'?'RECADO DO CAHK':item.type==='event'?'AGENDA CAHK':'RÁDIO CAHK';$('#title').textContent=item.title||'Rádio CAHK';$('#channel').textContent='';$('#announcementText').textContent=item.text||'';if(item.audio_url){audio=new Audio(item.audio_url);audio.onended=()=>next();audio.onerror=()=>speak(item.text,voice);audio.play().catch(()=>speak(item.text,voice))}else speak(item.text,voice)}async function next(){if(!started||nextLock)return;nextLock=true;$('#playerMsg').textContent='Preparando próximo item…';try{const j=await fn('radio-next');if(j.type==='video')showVideo(j.item);else if(j.type==='announcement')showAnn(j.item,j.voice);else{idle=true;current=null;currentType=null;$('#title').textContent='Aguardando programação';$('#channel').textContent='';$('#sourceBadge').textContent='EM ESPERA';$('#playerMsg').textContent=j.message||'Sem conteúdo disponível.';setTimeout(()=>{if(started&&idle)next()},15000)}qload();if(j.type!=='idle')$('#playerMsg').textContent=''}catch(e){idle=true;$('#playerMsg').textContent=e.message;setTimeout(()=>{if(started)next()},10000)}finally{nextLock=false}}async function finishVideo(){if(currentType!=='video'||!current)return next();try{await fn('queue-admin',{action:'finish',id:current.id})}catch(e){$('#playerMsg').textContent=e.message}current=null;currentType=null;setTimeout(next,250)}$('#start').onclick=async()=>{if(!token())return $('#startMsg').textContent='Digite o código administrativo.';localStorage.setItem('radioCahkAdmin',token());$('#startMsg').textContent='Validando…';started=true;try{const j=await fn('radio-next');$('#loginCard').classList.add('hidden');$('#station').classList.remove('hidden');if(j.type==='video')showVideo(j.item);else if(j.type==='announcement')showAnn(j.item,j.voice);else{idle=true;$('#playerMsg').textContent=j.message||'';next()}qload()}catch(e){started=false;$('#startMsg').textContent=e.message}};$('#skip').onclick=async()=>{speechSynthesis.cancel();if(audio){audio.pause();audio=null}if(currentType==='video'&&current){try{await fn('queue-admin',{action:'skip',id:current.id})}catch(e){$('#playerMsg').textContent=e.message}}current=null;currentType=null;next()};$('#clear').onclick=async()=>{if(!confirm('Remover todos os pedidos da fila?'))return;try{await fn('queue-admin',{action:'clear'});qload()}catch(e){$('#playerMsg').textContent=e.message}};$('#admin').onclick=()=>location.href='/admin.html';const saved=localStorage.getItem('radioCahkAdmin');if(saved)$('#token').value=saved;sb.channel('radio-player').on('postgres_changes',{event:'*',schema:'public',table:'queue'},()=>{qload();if(started&&idle)next()}).subscribe();qload();
</script></body></html>
